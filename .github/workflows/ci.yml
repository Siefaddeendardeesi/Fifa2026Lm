name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev,pipeline]"
      - run: black --check src app tests scripts monitoring
      - run: isort --check-only src app tests scripts monitoring
      - run: ruff check src app tests scripts monitoring
      - run: mypy src app monitoring

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev,pipeline]"
      - run: pytest tests/ --cov=src --cov=app --cov-report=xml --cov-fail-under=90
      - uses: codecov/codecov-action@v4
        if: always()

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --upgrade "pip>=26.1"
      - run: pip install -e ".[dev]"
      - run: pip-audit --desc on

  compose-config:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compose environment
        run: cp docker/.env.example docker/.env
      - name: Validate compose configuration
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env config
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.prod.yml \
            --env-file docker/.env config

  mlflow-registry:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: Register champion model
        run: python scripts/register_mlflow_champion.py
      - name: Verify production model in registry
        run: bash scripts/verify_mlflow.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: pip install build
      - run: python -m build

  docker:
    runs-on: ubuntu-latest
    needs: [test, build, compose-config]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: fifa2026lm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        target: [aws, azure, gcp, render, railway]
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment script
        run: |
          test -f "deployment/deploy-${{ matrix.target }}.sh"
          bash -n "deployment/deploy-${{ matrix.target }}.sh"
      - name: Deployment note
        run: |
          echo "Deploy to ${{ matrix.target }} requires cloud credentials."
          echo "See docs/deployment_guide.md for manual deployment steps."
