# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d

services:
  api:
    ports: []
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  dashboard:
    ports: []
    expose:
      - "8501"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  postgres:
    ports: []
    expose:
      - "5432"

  mlflow:
    ports: []
    expose:
      - "5000"

  prometheus:
    ports: []

  grafana:
    ports: []

  frontend:
    ports: []
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  nginx:
    ports:
      - "${NGINX_PORT:-443}:443"
      - "${NGINX_HTTP_PORT:-80}:80"
