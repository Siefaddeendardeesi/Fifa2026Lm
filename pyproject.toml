[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fifa2026lm"
version = "1.0.0"
description = "FIFA World Cup 2026 Prediction Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FIFA2026LM Team" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "optuna>=3.5",
    "mlflow>=2.10",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandera>=0.18",
    "structlog>=24.1",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "slowapi>=0.1.9",
    "streamlit>=1.28",
    "httpx>=0.26",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "html5lib>=1.1",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "tqdm>=4.66",
    "kaggle>=1.6",
    "prometheus-client>=0.19",
    "shap>=0.44",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "tenacity>=8.2",
    "starlette>=1.0.1,<2",
    "idna>=3.15",
]

[project.optional-dependencies]
pipeline = [
    "dvc>=3.0",
    "dvc-s3>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.26",
    "black>=24.1",
    "isort>=5.13",
    "ruff>=0.2",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "types-requests>=2.31",
    "types-tqdm>=4.66",
    "pip>=26.1",
    "pip-audit>=2.7",
]

[project.scripts]
fifa-etl = "scripts.cli:etl_main"
fifa-train = "scripts.cli:train_main"
fifa-api = "app.api.main:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "scripts*", "monitoring*"]

[tool.setuptools.package-data]
app = ["resources/*.csv"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/(Understand-Anything|notebooks|\\.venv|htmlcov|build|dist)/"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "app", "scripts", "monitoring"]
skip = ["Understand-Anything", "notebooks", ".venv", "htmlcov"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "Understand-Anything",
    "notebooks",
    ".venv",
    "htmlcov",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008", "UP047"]

[tool.ruff.lint.per-file-ignores]
"app/dashboard/main.py" = ["E402"]
"scripts/cli.py" = ["E402"]
"scripts/register_mlflow_champion.py" = ["E402", "E501"]
"tests/conftest.py" = ["E402"]
"src/ui/**" = ["E501", "B905"]
"src/simulation/engine.py" = ["SIM103"]
"src/models/evaluation.py" = ["E501"]
"scripts/parse_wc2026_squads.py" = ["E501", "SIM102"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["E741"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
packages = ["src", "app", "monitoring"]
plugins = ["pydantic.mypy"]
exclude = [
    "^Understand-Anything/.*",
    "^notebooks/.*",
    "^tests/.*",
    "^scripts/.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=90"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*sklearn.utils.parallel.delayed.*:UserWarning",
]

[tool.coverage.run]
source = ["src", "app"]
omit = ["tests/*", "notebooks/*", "src/ui/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
